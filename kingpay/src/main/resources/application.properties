spring.application.name=kingpay
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:validate}

kingpay.jwt.secret=${JWT_SECRET}
kingpay.jwt.issuer=${JWT_ISSUER:kingpay}
kingpay.jwt.ttl-seconds=${JWT_TTL_SECONDS:3600}
kingpay.admin.user-ids=${KINGPAY_ADMIN_USER_IDS:}

springdoc.packages-to-scan=com.kingpay.controller
springdoc.override-with-generic-response=false
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.persist-authorization=false
springdoc.api-docs.version=OPENAPI_3_0
springdoc.default-produces-media-type=application/json
